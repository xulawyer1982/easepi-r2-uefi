# =============================================================================
#  fxrecovery for EasePi R2 · GRUB 配置
#
#  由 SD 卡上的 EDK2 UEFI 固件加载 /EFI/BOOT/BOOTAA64.EFI（本 GRUB），
#  再由 GRUB 引导 Linux 内核 + initramfs，起来后提供网页刷机界面。
#
#  注意：console 同时挂串口与 HDMI。EasePi R2 的调试串口是 ttyS2 @ 1500000 8N1，
#  这不是标准 115200，串口工具必须显式设置，否则全是乱码。
# =============================================================================

set timeout=5
set default=0
set gfxmode=auto

insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod linux
insmod devicetree
insmod efi_gop
insmod efi_uga

# ---------------------------------------------------------------------------
# 0. 已装系统的引导项（由刷机环境扫描生成，刷完系统重启后才出现）
#
#    飞牛 / ophub 这类 ARM 镜像是 U-Boot + extlinux.conf 体系，盘上没有 EFI
#    引导器，下面的 chainload 扫不到。所以由 initramfs 里的 init 去读目标系统
#    自己的 extlinux.conf，把它的内核 / dtb / initrd / cmdline 翻译成 GRUB 菜单
#    写在这里。固件因此不绑定任何内核版本——目标系统换内核，这里跟着变。
# ---------------------------------------------------------------------------
if [ -f /boot/grub/fxboot.cfg ]; then
    source /boot/grub/fxboot.cfg
fi

# ---------------------------------------------------------------------------
# 1. 网页刷机环境（默认）
# ---------------------------------------------------------------------------
menuentry "fxrecovery — 网页刷机 (RK3588 / EasePi R2)" --id=recovery {
    echo "载入内核 ..."
    linux /boot/Image \
        console=ttyS2,1500000n8 console=tty0 \
        root=/dev/ram0 rw init=/init \
        rdinit=/init \
        loglevel=7 \
        panic=10 \
        net.ifnames=0

    echo "载入设备树 ..."
    devicetree /boot/dtb/rk3588-easepi-r2.dtb

    echo "载入 initramfs ..."
    initrd /boot/initramfs.cpio.gz
}

# ---------------------------------------------------------------------------
# 2. 引导已装到 NVMe / SATA 上的系统（兜底）
#    只适用于本身带 EFI 引导器的系统（Debian / Armbian / openEuler 的 UEFI 镜像）。
#    飞牛这类 U-Boot 系镜像走上面第 0 段生成的菜单项，不走这里。
#    RK3588 BootROM 不能从 NVMe/SATA 直接引导，所以必须经过 SD 卡这一段。
# ---------------------------------------------------------------------------
menuentry "启动已安装的系统 (扫描各盘 EFI 引导器 · 兜底)" {
    insmod part_gpt
    insmod fat
    insmod chain

    for disk in hd0 hd1 hd2 hd3; do
        for part in gpt1 gpt2 gpt3 msdos1 msdos2 msdos3; do
            if [ -e ($disk,$part)/EFI/BOOT/BOOTAA64.EFI ]; then
                # 跳过 SD 卡自己：$root 的格式是 "hd0,gpt1"（无括号），
                # 写成 "($disk,$part)" 就永远不等于它，会 chainload 回自己。
                if [ "$disk,$part" != "$root" ]; then
                    echo "尝试 ($disk,$part) ..."
                    set root=($disk,$part)
                    chainloader /EFI/BOOT/BOOTAA64.EFI
                    boot
                fi
            fi
        done
    done

    echo "没有找到可引导的系统。"
    sleep 3
}

# ---------------------------------------------------------------------------
# 3. 交回 UEFI 固件，让它按自己的启动顺序继续
# ---------------------------------------------------------------------------
menuentry "返回 UEFI 固件 (Boot Manager)" {
    exit
}

# ---------------------------------------------------------------------------
# 4. UEFI Shell（排障用）
# ---------------------------------------------------------------------------
menuentry "UEFI Shell (排障)" {
    if [ -e /EFI/BOOT/Shell.efi ]; then
        chainloader /EFI/BOOT/Shell.efi
    else
        echo "本固件 FV 内的 Shell 需从启动菜单进入；此处无独立 Shell.efi。"
        sleep 3
    fi
}
